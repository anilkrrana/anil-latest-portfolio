<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091428"/>
      <stop offset="50%" stop-color="#0c2340"/>
      <stop offset="100%" stop-color="#001830"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A1E0"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0072CE"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Glow Hexagon / Shield -->
  <polygon points="200,18 360,105 360,295 200,382 40,295 40,105" 
           stroke="url(#borderGrad)" stroke-width="6" fill="url(#shieldGrad)" filter="url(#glow)"/>

  <!-- Inner Decorative Border -->
  <polygon points="200,34 344,113 344,287 200,366 56,287 56,113" 
           stroke="rgba(0, 161, 224, 0.4)" stroke-width="1.5" fill="none"/>

  <!-- Salesforce Cloud on Top -->
  <g transform="translate(170, 52) scale(0.6)">
    <path fill="#00A1E0" d="M41.7 13.5c4.7-5.1 11.5-8.2 19-8.2 11.3 0 21 7.2 24.5 17.5 4.3 1.2 7.8 4.3 9.7 8.5 2 4.4 1.7 9.4-.8 13.5-2.6 4.2-7.1 6.8-12.1 6.9H18c-5.9-.1-11.4-3.5-14.1-8.7-2.7-5.2-2.1-11.5 1.5-16.1 3.5-4.5 9-6.9 14.7-6.5.6-2.5 1.8-4.9 3.5-6.8 4.6-5.1 11.2-8.1 18.1-8.1z"/>
  </g>

  <!-- Title: SALESFORCE CERTIFIED -->
  <text x="200" y="112" text-anchor="middle" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" letter-spacing="3.5">
    SALESFORCE CERTIFIED
  </text>
  
  <line x1="100" y1="124" x2="300" y2="124" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Center MuleSoft Connected Nodes Graphic -->
  <g transform="translate(120, 138) scale(0.65)">
    <!-- Central Node -->
    <circle cx="120" cy="80" r="28" fill="#00A1DF" opacity="0.9"/>
    <!-- Outer orbiting interconnected nodes -->
    <circle cx="50" cy="30" r="14" fill="#00E5FF"/>
    <circle cx="190" cy="30" r="14" fill="#00E5FF"/>
    <circle cx="40" cy="120" r="16" fill="#00A1DF"/>
    <circle cx="200" cy="120" r="16" fill="#00A1DF"/>
    <circle cx="120" cy="160" r="15" fill="#0072CE"/>
    
    <!-- Connectors -->
    <line x1="120" y1="80" x2="50" y2="30" stroke="#00E5FF" stroke-width="4"/>
    <line x1="120" y1="80" x2="190" y2="30" stroke="#00E5FF" stroke-width="4"/>
    <line x1="120" y1="80" x2="40" y2="120" stroke="#00A1DF" stroke-width="4"/>
    <line x1="120" y1="80" x2="200" y2="120" stroke="#00A1DF" stroke-width="4"/>
    <line x1="120" y1="80" x2="120" y2="160" stroke="#0072CE" stroke-width="4"/>

    <!-- Inner Core Symbol 'M' -->
    <path d="M106 90 V70 L120 84 L134 70 V90" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Core Credential Text -->
  <text x="200" y="278" text-anchor="middle" fill="#00E5FF" font-family="'Outfit', sans-serif" font-size="22" font-weight="900" letter-spacing="1.5">
    MuleSoft Developer I
  </text>
  
  <!-- Level Badge -->
  <rect x="145" y="296" width="110" height="24" rx="12" fill="#00A1DF" opacity="0.25" stroke="#00E5FF" stroke-width="1"/>
  <text x="200" y="312" text-anchor="middle" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="2">
    LEVEL 1 · ACTIVE
  </text>

  <!-- Gold Star of Excellence -->
  <polygon points="200,332 205,344 218,344 207,352 211,364 200,356 189,364 193,352 182,344 195,344" 
           fill="url(#goldGrad)" filter="url(#glow)"/>
</svg>